<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vietnam Life</title>
<meta name="description" content="Vietnam Life — планер жизни во Вьетнаме: расходы, жильё, коммуналка, питание, цели, поездки и заметки.">
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic,vietnamese">
<link rel="preload" as="image" href="img/hero.jpg">
<style>/* Layout: fixed left rail + hero banner + 3-column card grid, cream ground, forest-green accent (matches the user's mockup, light-only) */
:root{
  --bg:#f5f3ec; --card:#fffefb; --line:#ece8de; --soft:#f3f1ea;
  --fg:#1d2621; --muted:#6f746d; --faint:#9b9f97;
  --green:#3c6b48; --green2:#2f9e5b; --green-soft:#e6f2e8; --lime:#a8d5ad;
  --red:#e8484a; --orange:#f5a63c; --blue:#4c7fe0; --purple:#6b62d9;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --script:'Caveat',cursive;
  --r:16px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--fg)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--green2);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:182px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:#f8f6f0;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.brand{display:flex;flex-direction:column;align-items:center;padding:14px 8px 18px;text-align:center}
.brand img{width:50px;height:54px;object-fit:cover;mix-blend-mode:multiply}
.brand b{font-size:21px;font-weight:600;letter-spacing:-.2px;margin-top:2px}
.brand small{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px;padding:0 7px;overflow:auto}
.nav a{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:9px;color:#3b423d;font-size:13px}
.nav a:hover{background:#efece3}
.nav a.on{background:var(--green);color:#fff;box-shadow:0 3px 8px rgba(60,107,72,.25)}
.nav a svg.i{width:19px;height:19px}
.side-foot{margin-top:auto;position:relative;height:270px;flex:none}
.side-foot img{position:absolute;inset:0 0 auto 0;width:100%;height:170px;object-fit:cover;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.side-foot .quote{position:absolute;left:0;right:0;bottom:0;background:#fffefb;border-radius:22px 22px 0 0;padding:22px 16px 30px 36px;font-size:11.5px;color:#333}
.side-foot .quote b{font-weight:600;display:block}

/* main */
.main{min-width:0;padding:0 12px 24px 12px}
.hero{position:relative;height:150px;margin:0 -12px;background:#2b3a33 center/cover no-repeat;color:#fff;display:flex;justify-content:space-between;padding:14px 18px 0 46px;gap:16px}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,30,22,.55),rgba(15,30,22,.05) 40%,rgba(15,30,22,0) 60%,rgba(15,30,22,.45))}
.hero>*{position:relative}
.hello h1{font-family:var(--script);font-weight:600;font-size:52px;line-height:1;margin:6px 0 4px;display:flex;align-items:center;gap:10px;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.hello h1 .sun{width:34px;height:34px;color:#ffd84a}
.hello p{margin:0;font-size:14.5px;line-height:1.45;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.hero-r{display:flex;flex-direction:column;gap:12px;align-items:flex-end;padding-top:4px}
.hero-row{display:flex;align-items:center;gap:26px;font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.wx{display:flex;gap:8px;align-items:center}
.wx .t{font-size:22px;font-weight:600}
.wx .ic{width:40px;height:40px}
.dt b{font-size:12px;font-weight:500;display:block}
.avatar{display:flex;align-items:center;gap:6px;padding-left:20px;border-left:1px solid rgba(255,255,255,.35)}
.avatar img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.7)}
.search{position:relative;width:430px;max-width:100%}
.search input{width:100%;height:36px;border-radius:10px;border:0;padding:0 14px 0 40px;font-size:11px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.search svg{position:absolute;left:14px;top:9px;color:#333}
.sres{position:absolute;top:40px;left:0;right:0;background:#fff;color:var(--fg);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:320px;overflow:auto;z-index:30;text-shadow:none}
.sres a{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px}
.sres a:hover{background:var(--soft)}
.sres em{font-style:normal;color:var(--muted)}
.burger{display:none}

.page{margin-top:-8px;position:relative;display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(40,40,20,.04),0 4px 14px rgba(40,40,20,.05);padding:16px;min-width:0}
.row{display:grid;gap:12px}
.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
.r3a{grid-template-columns:1.33fr 1fr 1.17fr}
.r3b{grid-template-columns:1.33fr .96fr 1.17fr}
.r3c{grid-template-columns:1.33fr .96fr 1.17fr}
.chd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.chd h3{margin:0;font-size:13.5px;font-weight:600}
.chd .sub{font-size:11.5px;color:#444;margin-top:1px}
.chd .sp{margin-left:auto}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib.g{background:#e3f1e5;color:var(--green2)}.ib.o{background:#fdf0dc;color:#d98a12}.ib.r{background:#fde5e3;color:var(--red)}
.ib.b{background:#e5edfb;color:var(--blue)}.ib.p{background:#ece9fb;color:var(--purple)}.ib.y{background:#fdf4d7;color:#e3a90c}
.link{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500}
.link svg.i{width:14px;height:14px}
.link:hover{color:var(--green)}
.sel{border:1px solid var(--line);background:#fff;border-radius:8px;height:30px;padding:0 10px;font-size:11.5px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;border-radius:8px;padding:7px 12px;font-size:11.5px;font-weight:500}
.btn:hover{background:#335d3e}
.btn.ghost{background:#fff;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f3c9c9}
.btn svg.i{width:14px;height:14px}
.muted{color:var(--muted)}
.up{color:var(--red)}.down{color:var(--green2)}
.bar{height:6px;border-radius:6px;background:#eceae3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--green2)}

/* stat cards */
.stat{display:flex;gap:12px;min-height:124px}
.stat .body{flex:1;min-width:0}
.stat h4{margin:4px 0 8px;font-size:13px;font-weight:600}
.stat .big{font-size:20px;font-weight:700;letter-spacing:-.3px}
.stat .usd{font-size:11.5px;color:#555;margin-top:3px}
.spark{display:flex;align-items:flex-end;gap:4px;height:40px}
.spark i{width:5px;border-radius:3px;background:var(--lime)}
.spark i:last-child{background:var(--green2)}
.stat .thumb{width:90px;height:92px;border-radius:10px;object-fit:cover;flex:none}
.thumbwrap{position:relative;flex:none}
.badge{position:absolute;right:6px;bottom:6px;background:var(--green2);color:#fff;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px}

/* donut */
.donutwrap{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center}
.donut{position:relative;width:200px;height:200px}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{font-size:17px;font-weight:700;display:block}
.donut .c span{font-size:10.5px;color:#555}
.legend{display:grid;gap:9px;font-size:11px}
.legend div{display:grid;grid-template-columns:12px 1fr 40px 96px;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:50%}
.legend .v{text-align:right}

/* apartment */
.apt-photo{position:relative;border-radius:10px;overflow:hidden;height:148px;background:#ddd}
.apt-photo img{width:100%;height:100%;object-fit:cover}
.apt-photo .tag{position:absolute;right:8px;top:8px;background:var(--green2);color:#fff;font-size:10.5px;border-radius:6px;padding:2px 8px}
.apt-photo .info{position:absolute;left:0;right:0;bottom:0;padding:24px 16px 8px;background:linear-gradient(transparent,rgba(255,255,255,.93) 38%)}
.apt-photo .info b{font-size:13px;font-weight:600;display:block}
.apt-photo .info .p{font-size:15px;font-weight:700;margin:2px 0 4px}
.apt-meta{display:flex;gap:14px;font-size:10.5px;color:#555;flex-wrap:wrap}
.apt-meta span{display:inline-flex;gap:4px;align-items:center}
.apt-meta svg.i{width:12px;height:12px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 10px}
.thumbs img{width:100%;height:40px;object-fit:cover;border-radius:6px}

/* utilities */
.util{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ubars{display:grid;grid-template-columns:22px 1fr;margin-top:16px;height:116px}
.uaxis{display:flex;flex-direction:column;justify-content:space-between;font-size:9.5px;color:var(--muted);padding-bottom:16px}
.ucols{display:flex;align-items:flex-end;justify-content:space-around;border-bottom:1px solid var(--line);position:relative;margin-bottom:16px}
.ucols div{width:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.ucols i{display:block;width:100%;background:#a9d9b0;border-radius:2px 2px 0 0}
.ucols div.on i{background:var(--green2)}
.ucols span{position:absolute;bottom:-16px;font-size:9.5px;color:var(--muted)}
.ulist{display:grid;gap:13px;font-size:11.5px;align-content:start;padding-top:6px}
.ulist div{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center}
.ulist svg.i{width:15px;height:15px}

/* food */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:10px}
.days button{height:24px;border-radius:12px;background:var(--soft);font-size:11px;color:#444}
.days button.on{background:#3d8a52;color:#fff}
.meals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.meal img{width:100%;aspect-ratio:115/80;object-fit:cover;border-radius:8px;max-width:100%}
.meal b{display:block;font-size:11.5px;font-weight:600;margin:10px 0 3px}
.meal span{font-size:11px;color:#444}
.meal{cursor:pointer;text-align:left}

/* calendar list */
.ev{display:grid;grid-template-columns:30px 26px 1fr 20px;align-items:center;gap:6px;padding:5px 0}
.ev .d b{font-size:13px;font-weight:600;display:block;line-height:1.1}
.ev .d small{font-size:9.5px;color:var(--muted)}
.ev .t{font-size:11.5px}
.ev .t small{display:block;color:var(--muted);font-size:10px}
.chk{width:15px;height:15px;border:1.5px solid #ccd0c9;border-radius:3px;display:grid;place-items:center;background:#fff;flex:none}
.chk.on{background:var(--green2);border-color:var(--green2);color:#fff}
.chk svg.i{width:11px;height:11px;stroke-width:3}

/* trips */
.trips{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.trip{position:relative;border-radius:10px;overflow:hidden;height:100px;color:#fff;cursor:pointer}
.trip img{width:100%;height:100%;object-fit:cover}
.trip:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.6))}
.trip .tx{position:absolute;left:10px;bottom:8px;z-index:1}
.trip .tx b{font-size:13px;font-weight:600;display:block}
.trip .tx span{font-size:10.5px}
.trip .badge{z-index:1;right:8px;bottom:9px}
.tcheck{display:grid;grid-template-columns:1fr 190px;gap:8px;margin-top:10px}
.tlist{display:grid;gap:7px;font-size:11.5px}
.tlist label{display:flex;gap:12px;align-items:center;cursor:pointer}
.tmap{width:100%;height:110px;object-fit:contain;mix-blend-mode:multiply}

/* goals */
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:10px;border-radius:12px;background:#fbfaf6;cursor:pointer}
.goal .ib{width:30px;height:30px}
.goal .ib svg.i{width:15px;height:15px}
.goal .top{display:grid;grid-template-columns:1fr 46px 30px;gap:8px;align-items:center;font-size:11px}
.goal .top em{font-style:normal;font-size:9.5px;color:#666;text-align:right}
.goal .amt{font-size:11.5px;margin-top:4px}

/* useful tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:52px;border:1px solid var(--line);border-radius:10px;font-size:10px;color:#444;background:#fff}
.tile:hover{border-color:var(--lime);background:#fbfdf9}

/* notes */
.notes{display:grid;grid-template-columns:1fr 184px;gap:12px}
.nlist{display:grid;gap:8px;font-size:11px}
.nlist label{display:flex;gap:12px;align-items:center;cursor:pointer}
.nlist .done span{color:#333}
.nphoto{width:100%;height:100%;min-height:150px;object-fit:cover;border-radius:12px}

/* section pages */
.ptitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 0}
.ptitle h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px}
.ptitle .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr:hover td{background:#fbfaf6}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.acts{display:flex;gap:4px;justify-content:flex-end}
.acts button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.acts button:hover{background:var(--soft);color:var(--fg)}
.acts svg.i{width:15px;height:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi small{color:var(--muted);font-size:11.5px}
.kpi b{display:block;font-size:20px;margin-top:4px;letter-spacing:-.3px}
.kpi span{font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gridc{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:12.5px}
.mbars{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:20px;border-bottom:1px solid var(--line)}
.mbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;min-width:0}
.mbars i{width:100%;max-width:38px;background:#a9d9b0;border-radius:4px 4px 0 0}
.mbars div.on i{background:var(--green2)}
.mbars em{font-style:normal;font-size:9.5px;color:var(--muted);margin-bottom:4px;white-space:nowrap}
.mlabels{display:flex;gap:10px;font-size:10px;color:var(--muted);margin-top:6px}
.mlabels span{flex:1;text-align:center}
.hbar{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;font-size:12px;margin:8px 0}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calgrid .h{font-size:11px;color:var(--muted);text-align:center;padding:4px}
.calgrid .c{min-height:84px;border:1px solid var(--line);border-radius:8px;padding:5px;background:#fff;cursor:pointer;min-width:0}
.calgrid .c.out{opacity:.4}
.calgrid .c.today{border-color:var(--green2);box-shadow:inset 0 0 0 1px var(--green2)}
.calgrid .c b{font-size:11.5px}
.calgrid .c span{display:block;font-size:10px;background:var(--green-soft);color:#235c36;border-radius:4px;padding:1px 4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calgrid .c span.trip{background:#e3eefc;color:#2a55a8}
.apt-card img.cover{width:100%;height:160px;object-fit:cover;border-radius:10px}
.chip{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:10px;background:var(--soft);color:#555}
.chip.g{background:var(--green-soft);color:#235c36}
textarea.notearea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;resize:vertical;line-height:1.5}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,28,22,.38);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;width:440px;max-width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 14px;font-size:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
.field.full{grid-column:1/-1}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fbfaf7;font-size:13px}
.field input[type=checkbox]{width:18px;height:18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.mfoot .l{margin-right:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2a24;color:#fff;padding:9px 16px;border-radius:10px;font-size:12px;z-index:60}
.status{font-size:10.5px;color:var(--muted);padding:6px 16px}

@media (max-width:1280px){
  .r3a,.r3b,.r3c{grid-template-columns:1fr 1fr}
  .r3a>:first-child,.r3b>:first-child,.r3c>:first-child{grid-column:1/-1}
  .search{width:340px}
}
@media (max-width:1000px){
  .r4{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:230px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .burger{display:grid;position:absolute;left:12px;top:12px;width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.9);color:#1d2621;place-items:center;z-index:2}
  .hero{height:auto;flex-direction:column;padding:56px 16px 22px}
  .hero-r{align-items:stretch}
  .hero-row{justify-content:space-between;gap:12px;flex-wrap:wrap}
  .search{width:100%}
  .main{padding:0 16px 24px}
  .hero{margin:0 -16px}
  .r3a,.r3b,.r3c{grid-template-columns:1fr}
}
@media (max-width:560px){
  .r4{grid-template-columns:1fr}
  .donutwrap{grid-template-columns:1fr;justify-items:center}
  .legend{width:100%}
  .util,.tcheck,.notes,.goals{grid-template-columns:1fr}
  .meals{grid-template-columns:1fr 1fr}
  .days{gap:3px}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .hbar{grid-template-columns:90px 1fr 90px}
  .calgrid .c{min-height:56px}
  .calgrid .c span{font-size:0;height:5px;padding:0}
  .fgrid{grid-template-columns:1fr}
  .tmap{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- design refresh: 3D icons (Blender), generated photography (Codex), motion ---------- */
.brand img{width:68px;height:68px;object-fit:contain;mix-blend-mode:normal;filter:drop-shadow(0 6px 8px rgba(30,60,40,.18));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.brand:hover img{transform:rotate(-6deg) scale(1.06)}
.brand b{background:linear-gradient(90deg,#2b5a37,#3c8a52);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav a{transition:background .2s,color .2s,transform .2s}
.nav a:hover{transform:translateX(2px)}
.nav a.on{background:linear-gradient(135deg,#3c6b48,#2f8a52)}
.side-foot img{height:190px}

.hero{height:196px;background-position:center 58%;overflow:hidden}
.hero:before{background:linear-gradient(90deg,rgba(10,28,20,.62),rgba(10,28,20,.12) 42%,rgba(10,28,20,0) 58%,rgba(10,28,20,.5)),linear-gradient(transparent 60%,rgba(245,243,236,.35))}
.hello{animation:vlRise .8s cubic-bezier(.2,.8,.2,1) both}
.hello h1{font-size:58px}
.hero-r{animation:vlRise .8s .12s cubic-bezier(.2,.8,.2,1) both}
.search input{height:38px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.page{margin-top:-26px}

.card{border:1px solid rgba(236,232,222,.8);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.page .card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(40,40,20,.05),0 14px 32px rgba(40,60,30,.10)}
.page>.row{animation:vlRise .6s cubic-bezier(.2,.8,.2,1) both}
.page>.row:nth-child(2){animation-delay:.06s}.page>.row:nth-child(3){animation-delay:.12s}.page>.row:nth-child(4){animation-delay:.18s}

.ib3d{width:56px;height:56px;object-fit:contain;flex:none;margin:-6px -4px 0 -6px;filter:drop-shadow(0 6px 6px rgba(40,40,20,.14));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.card:hover .ib3d{transform:translateY(-3px) rotate(-4deg) scale(1.06)}
.chd .ib3d{width:42px;height:42px;margin:-4px 0}

.stat .thumb{box-shadow:0 6px 16px rgba(30,40,30,.16)}
.apt-photo img,.trip img{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.apt-photo:hover img,.trip:hover img{transform:scale(1.06)}
.thumbs img{transition:transform .25s,box-shadow .25s}
.thumbs img:hover{transform:translateY(-2px);box-shadow:0 6px 12px rgba(0,0,0,.15)}
.meal img{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;box-shadow:0 4px 10px rgba(40,30,10,.10)}

.trip{box-shadow:0 6px 16px rgba(20,40,40,.14)}

.tile{transition:transform .2s,border-color .2s,background .2s,box-shadow .2s}

.btn{transition:background .2s,transform .15s}

<script>function makeDemo(now){
  now=now||new Date();
  const pad=n=>String(n).padStart(2,'0');
  const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

  const Y=now.getFullYear(),M=now.getMonth(),today=now.getDate();
  let n=0;const id=p=>p+(++n).toString(36);
  // expenses: current month exactly as in the mockup, earlier months similar
  const base={'Аренда':16900000,'Питание':8700000,'Кафе и рестораны':5800000,'Транспорт':3400000,'Путешествия':7200000,'Коммуналка':2400000,'Другое':3850000};
  const notes={'Аренда':['Аренда квартиры'],'Питание':['Супермаркет Lotte','Рынок Чо Дам','WinMart','Фрукты'],'Кафе и рестораны':['Фо Бо','Кофе','Ужин у моря','Бань ми'],'Транспорт':['Grab','Аренда байка','Бензин'],'Путешествия':['Билеты в Дананг','Отель в Дананге'],'Коммуналка':['Коммуналка за месяц'],'Другое':['Аптека','Стрижка','Подарки']};
  const mult=[1,1.12,1.06,1.034,1.107,0.976]; // current, -1, -2 ...
  const expenses=[];
  mult.forEach((k,back)=>{
    const lastDay=back===0?Math.max(1,today):new Date(Y,M-back+1,0).getDate();
    Object.entries(base).forEach(([cat,sum],ci)=>{
      const parts=cat==='Аренда'||cat==='Коммуналка'?1:(cat==='Путешествия'?2:notes[cat].length);
      let total=Math.round(sum*(back===0?1:k*(0.9+((ci*37+back*11)%20)/100))/10000)*10000;
      let left=total;
      for(let p=0;p<parts;p++){
        const amt=p===parts-1?left:Math.round(total/parts*(0.8+((p*13+ci)%5)/10)/10000)*10000;
        left-=amt;
        const day=cat==='Аренда'?1:1+((p*7+ci*5+back*3)%lastDay);
        expenses.push({id:id('e'),date:iso(new Date(Y,M-back,day)),cat,amount:amt,note:notes[cat][p%notes[cat].length]});
      }
    });
  });
  const utilities=[[1750000,700000],[2650000,1300000],[2450000,1150000],[2600000,1250000],[2400000,1100000]].map((u,i)=>{
    const back=4-i, el=u[1], rest=u[0]-el;
    return {id:id('u'),month:mkey(Y,M-back),electricity:el,water:back?Math.round(rest*.25/1000)*1000:320000,internet:250000,garbage:120000,service:back?rest-Math.round(rest*.25/1000)*1000-370000:610000,kwh:Math.round(el/3000)};
  });

  ];

    {id:id('g'),title:'Курс вьетнамского',saved:50,target:300,color:'#e8484a',icon:'book',featured:false}
  ];
  const t1=addD(now,3);
  const events=[
    {id:id('v'),date:iso(t1),from:'08:00',to:'09:00',title:'Йога',type:'sport',done:false},

    {id:id('v'),date:iso(addD(now,12)),from:'19:00',to:'21:00',title:'Ужин с друзьями',type:'other',done:false}
  ];
  const trips=[
    {id:id('t'),city:'Дананг',from:iso(addD(now,5)),to:iso(addD(now,11)),img:'trip1',budget:7200000,checklist:[{t:'Купить билеты',d:true},{t:'Забронировать отель',d:true},{t:'Составить маршрут',d:true},{t:'Оформить страховку',d:false}],note:'Бана Хиллс, Мраморные горы, Хойан'},

  ];
  const D=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const plan=[
    [['Овсянка с манго','и чиа'],['Бо с говядиной',''],['Курица с рисом','и овощами'],['Смузи боул','']],
    [['Яйца и тосты','с авокадо'],['Фо га','с курицей'],['Рыба на пару','с рисом'],['Йогурт','с бананом']],
    [['Сырники','с ягодами'],['Бун ча','с зеленью'],['Тофу','с овощами вок'],['Кокос','и орехи']],

    [['Панкейки','с бананом'],['Фо бо','с говядиной'],['Суп канх','с рыбой'],['Смузи боул','']]
  ];
  const meals={days:D.map((d,i)=>({day:d,items:plan[i].map((m,j)=>({name:m[0],desc:m[1],kcal:[380,520,560,240][j]}))}))};
  const notesList=[
    {id:id('n'),text:'Продлить визу (до '+iso(addD(now,18)).slice(8)+'.'+iso(addD(now,18)).slice(5,7)+')',done:true},
    {id:id('n'),text:'Найти новую квартиру на следующий месяц',done:true},
    {id:id('n'),text:'Проверить страховку',done:false},
    {id:id('n'),text:'Купить переходник',done:false},
    {id:id('n'),text:'Забронировать байк в Дананге',done:true}
  ];
  const health=[
    {id:id('h'),date:iso(addD(now,-20)),kind:'Страховка',title:'Медстраховка на год',cost:4800000,note:'Полис до конца следующего года'},

  ];
  const useful={
    sim:'Viettel, Mobifone и Vinaphone продают туристические SIM и eSIM. Для долгого проживания удобнее оформить SIM на паспорт в официальном офисе оператора.',
    transport:'Grab и Be для такси и байк-такси. Байк в аренду — посуточно или помесячно, нужны права категории A.',
    visa:'E-visa до 90 дней оформляется онлайн на официальном портале. Следить за датой выезда!',

    banks:'Карту местного банка удобно иметь для QR-оплаты. Банкоматы с низкой комиссией: Vietcombank, TPBank.',
    shopping:'Рынки — торговаться можно. Супермаркеты: Lotte Mart, WinMart, Co.opmart.',
    hacks:'Пить только бутилированную воду. Носить с собой мелкие купюры. В сезон дождей — дождевик под сиденьем байка.',
    services:'Доставка еды: GrabFood, ShopeeFood. Прачечная (giặt ủi) оплачивается за кг.'
  };
  const settings={name:'',city:'Нячанг',temp:32,feels:36,rate:25000,budget:70000000,kwhPrice:3000,quote:'«Больше жизни, меньше суеты»'};
  return {expenses,utilities,apartments,goals,events,trips,meals,notes:notesList,health,useful,settings};
}
if(typeof module!=='undefined')module.exports=makeDemo;
</script>

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const mkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const shiftM=(k,n)=>{const [y,m]=k.split('-').map(Number);return mkey(new Date(y,m-1+n,1))};
const mlabel=k=>{const [y,m]=k.split('-').map(Number);return MONTHS[m-1]+' '+y};
const mshort=k=>MSHORT[Number(k.split('-')[1])-1];
const fmt=n=>Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/ | /g,' ');
const vnd=n=>fmt(n)+' ₫';
const usd=n=>'≈ '+fmt((Number(n)||0)/(S.settings.rate||25000))+' $';
const dshort=s=>{const d=parse(s);return d.getDate()+' '+MGEN[d.getMonth()].slice(0,3)};
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c};

/* ---------- state & storage ---------- */
const S={expenses:[],utilities:[],apartments:[],goals:[],events:[],trips:[],meals:{days:[]},notes:[],health:[],useful:{},settings:{city:'Нячанг',temp:32,feels:36,rate:25000,budget:70000000,kwhPrice:3000,quote:'«Больше жизни, меньше суеты»',name:''}};
let db=null, mode='loading', loaded=false;
const LS='vietnam-life-v1';
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function body(sec){const v=S[sec];return Array.isArray(v)?{items:v}:v}
function apply(sec,b){if(!b)return;S[sec]=Array.isArray(S[sec])?(b.items||[]):Object.assign(sec==='settings'?{...S.settings}:{},b)}
function save(sec){
  if(mode==='db'&&db){db.doc('vl/'+sec).set(JSON.parse(JSON.stringify(body(sec)))).catch(e=>toast('Не удалось сохранить: '+(e&&e.message||e&&e.code||'ошибка')))}
  else lsSet();
  render();
}
function loadDemo(){const d=makeDemo(new Date());SECS.forEach(s=>{apply(s,Array.isArray(d[s])?{items:d[s]}:d[s]);});SECS.forEach(s=>{if(mode==='db'&&db)db.doc('vl/'+s).set(JSON.parse(JSON.stringify(body(s)))).catch(()=>{})});if(mode!=='db')lsSet();render();toast('Пример данных загружен')}
async function init(){
  render();
  let d=null;
  try{ d=window.claude&&window.claude.use?await window.claude.use('db'):null }catch(e){d=null}
  if(d){
    db=d;mode='db';
    db.collection('vl').onSnapshot(snap=>{
      snap.docs.forEach(doc=>{const id=doc.id||(doc.ref&&doc.ref.id)||String(doc.path||'').split('/').pop();if(SECS.includes(id))apply(id,doc.data())});
      loaded=true;render();
    },err=>{toast('База недоступна, сохраняю в этом браузере');fallback()});
  } else fallback();
}
function fallback(){mode='local';const l=lsGet();if(l){Object.keys(S).forEach(k=>{if(l[k]!=null)S[k]=l[k]})}else{const d=makeDemo(new Date());Object.keys(d).forEach(k=>S[k]=d[k]);lsSet()}loaded=true;render()}

/* ---------- derived ---------- */

const sum=a=>a.reduce((s,e)=>s+(Number(e.amount)||0),0);
const byCat=list=>{const m={};list.forEach(e=>{m[e.cat]=(m[e.cat]||0)+(Number(e.amount)||0)});return CATS.map(c=>[c[0],m[c[0]]||0,c[1]]).concat(Object.keys(m).filter(k=>!CATS.find(c=>c[0]===k)).map(k=>[k,m[k],'#999'])).filter(x=>x[1]>0)};
const utilTotal=u=>UTIL.reduce((s,[k])=>s+(Number(u[k])||0),0);
const curApt=()=>S.apartments.find(a=>a.current)||S.apartments[0];
const nextTrip=()=>S.trips.filter(t=>daysTo(t.to||t.from)>=0).sort((a,b)=>a.from<b.from?-1:1)[0];

/* ---------- dashboard ---------- */
function donutSVG(parts,size,w){
  const r=(size-w)/2,C=2*Math.PI*r,tot=parts.reduce((s,p)=>s+p[1],0)||1;let off=0;
  const seg=parts.map(p=>{const len=p[1]/tot*C;const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p[2]}" stroke-width="${w}" stroke-dasharray="${Math.max(0,len-1.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=len;return s}).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#eeece5" stroke-width="${w}"/>${seg}</svg>`;
}

/* ---------- analytics ---------- */
function analyticsPage(){
  const k=U.anMonth;const cur=monthExp(k),prevL=monthExp(shiftM(k,-1));const tot=sum(cur),prev=sum(prevL);
  const months=[];for(let i=11;i>=0;i--)months.push(shiftM(k,-i));const vals=months.map(m=>sum(monthExp(m)));const mx=Math.max(...vals,1);
  const nz=vals.filter(v=>v>0);const avg=nz.length?sum(nz.map(v=>({amount:v})))/nz.length:0;
  const cats=byCat(cur),pc=Object.fromEntries(byCat(prevL).map(c=>[c[0],c[1]]));

  const rent=cats.find(c=>c[0]==='Аренда');
  return `<div class="ptitle"><h2>Аналитика</h2><select class="sel" data-act="anMonth">${months.slice().reverse().map(m=>`<option value="${m}" ${m===k?'selected':''}>${mlabel(m)}</option>`).join('')}</select></div>
  <div class="kpis"><div class="card kpi"><small>Расходы за месяц</small><b class="num">${vnd(tot)}</b><span class="${tot>prev?'up':'down'}">${prev?(tot>prev?'+':'')+Math.round((tot-prev)/prev*100)+'% к прошлому месяцу':'—'}</span></div>
  <div class="card kpi"><small>Средний месяц (за год)</small><b class="num">${vnd(avg)}</b><span class="muted num">${usd(avg)}</span></div>
  <div class="card kpi"><small>Доля жилья</small><b class="num">${rent?pct(rent[1],tot):0}%</b><span class="muted">аренда от всех трат</span></div>
  <div class="card kpi"><small>Всего за 12 месяцев</small><b class="num">${vnd(vals.reduce((a,b)=>a+b,0))}</b><span class="muted num">${usd(vals.reduce((a,b)=>a+b,0))}</span></div></div>
  <div class="card"><div class="chd"><h3>Расходы по месяцам</h3></div><div class="mbars">${months.map((m,i)=>`<div class="${m===k?'on':''}"><em>${vals[i]?(vals[i]/1e6).toFixed(1)+'M':''}</em><i style="height:${vals[i]/mx*85}%"></i></div>`).join('')}</div><div class="mlabels">${months.map(m=>`<span>${mshort(m)}</span>`).join('')}</div></div>
  <div class="grid2"><div class="card"><div class="chd"><h3>Категории за ${mlabel(k).toLowerCase()}</h3></div>
    ${cats.length?cats.map(c=>{const p=pc[c[0]]||0,d=p?Math.round((c[1]-p)/p*100):null;return `<div class="hbar"><span><span class="dot" style="background:${c[2]}"></span>${esc(c[0])}</span><div class="bar" style="height:10px"><i style="width:${pct(c[1],cats[0][1]&&Math.max(...cats.map(x=>x[1])))}%;background:${c[2]}"></i></div><span class="num" style="text-align:right">${vnd(c[1])}<br><small class="${d>0?'up':'down'}">${d===null?'':(d>0?'+':'')+d+'%'}</small></span></div>`}).join(''):'<div class="empty">Нет данных</div>'}</div>
  <div class="card"><div class="chd"><h3>Крупнейшие траты</h3></div>${top.length?`<table><tbody>${top.map(e=>`<tr><td>${dshort(e.date)}</td><td><span class="dot" style="background:${catColor(e.cat)}"></span>${esc(e.note||e.cat)}</td><td class="r num"><b>${vnd(e.amount)}</b></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Нет данных</div>'}
  <div class="chd" style="margin-top:18px"><h3>Структура</h3></div><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="donut" style="width:150px;height:150px">${donutSVG(cats,150,28)}</div><div class="legend" style="flex:1;min-width:200px">${cats.map(c=>`<div style="grid-template-columns:12px 1fr 40px"><i style="background:${c[2]}"></i><span>${esc(c[0])}</span><span class="num">${pct(c[1],tot)}%</span></div>`).join('')}</div></div></div></div>`;
}

function calendarPage(){

let rootEl;
function render(){
  if(!rootEl)return;
  const ae=document.activeElement,aid=ae&&ae.id,pos=ae&&ae.selectionStart;
  rootEl.innerHTML=shell();
  $('#page').innerHTML=(PAGES[U.route]||home)();

/* ---------- search ---------- */
function searchRender(){
  const box=$('#sres');if(!box)return;const q=U.q.trim().toLowerCase();if(!q){box.innerHTML='';return}
  const r=[];
  S.expenses.forEach(e=>{if((e.note+' '+e.cat).toLowerCase().includes(q))r.push(['expenses',e.note||e.cat,dshort(e.date)+' · '+vnd(e.amount)])});
  S.events.forEach(e=>{if(e.title.toLowerCase().includes(q))r.push(['calendar',e.title,dshort(e.date)])});
  S.notes.forEach(e=>{if(e.text.toLowerCase().includes(q))r.push(['notes',e.text,'Заметка'])});
  S.goals.forEach(e=>{if(e.title.toLowerCase().includes(q))r.push(['goals',e.title,'Цель'])});
  S.trips.forEach(e=>{if(e.city.toLowerCase().includes(q))r.push(['trips',e.city,'Поездка'])});
  S.apartments.forEach(e=>{if((e.city+' '+e.name).toLowerCase().includes(q))r.push(['housing',e.city+', '+e.name,'Квартира'])});
  NAV.forEach(n=>{if(n[1].toLowerCase().includes(q))r.push([n[0],n[1],'Раздел'])});
  box.innerHTML=`<div class="sres">${r.slice(0,12).map(x=>`<a href="#${x[0]}" data-act="clearq"><span>${esc(x[1])}</span><em>${esc(x[2])}</em></a>`).join('')||'<a><span>Ничего не найдено</span></a>'}</div>`;
}

/* ---------- modal form ---------- */
function form(title,fields,vals,onSave,onDel){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><form class="fgrid">${fields.map(f=>{const v=vals[f.k]!=null?vals[f.k]:(f.def!=null?f.def:'');const id='f-'+f.k;
    if(f.t==='select')return `<label class="field ${f.full?'full':''}">${f.l}<select id="${id}" name="${f.k}">${f.o.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select></label>`;
    if(f.t==='check')return `<label class="field ${f.full?'full':''}" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="${id}" name="${f.k}" ${v?'checked':''}>${f.l}</label>`;
    if(f.t==='area')return `<label class="field full">${f.l}<textarea id="${id}" name="${f.k}" rows="6">${esc(v)}</textarea></label>`;
    return `<label class="field ${f.full?'full':''}">${f.l}<input id="${id}" name="${f.k}" type="${f.t||'text'}" value="${esc(v)}" ${f.req?'required':''} ${f.t==='number'?'step="any"':''}></label>`}).join('')}
    <div class="mfoot full">${onDel?`<button type="button" class="btn danger l" data-x="del">${ic('trash')} Удалить</button>`:''}<button type="button" class="btn ghost" data-x="cancel">Отмена</button><button class="btn" type="submit">${ic('check')} Сохранить</button></div></form></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener('click',e=>{if(e.target===bg)close();const x=e.target.closest('[data-x]');if(!x)return;if(x.dataset.x==='cancel')close();if(x.dataset.x==='del'){if(x.dataset.sure){onDel();close()}else{x.dataset.sure='1';x.innerHTML='Точно удалить?'}}});
  bg.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const o={};fields.forEach(f=>{const el=bg.querySelector('#f-'+f.k);o[f.k]=f.t==='check'?el.checked:f.t==='number'?(el.value===''?0:Number(el.value)):el.value.trim()});onSave(o);close()});
  const first=bg.querySelector('input,select,textarea');if(first)first.focus();
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

const remove=(sec,id)=>{S[sec]=S[sec].filter(x=>x.id!==id);save(sec)};
const find=(sec,id)=>S[sec].find(x=>x.id===id);

/* ---------- actions ---------- */
function act(a,el){
  const id=el.dataset.id;
  switch(a){
  case 'day':U.day=+el.dataset.i;render();break;
  case 'meal':{const d=+el.dataset.d,j=+el.dataset.j;const m=S.meals.days[d].items[j];form(MEALT[j]+', '+S.meals.days[d].day,[{k:'name',l:'Блюдо',req:1,full:1},{k:'desc',l:'Дополнение',full:1},{k:'kcal',l:'Калории',t:'number'}],m,o=>{S.meals.days[d].items[j]=o;save('meals')});break}
  case 'addExpense':form('Новый расход',F.expense,{date:iso(new Date()),cat:U.expCat||'Питание'},o=>{upsert('expenses',{id:uid(),...o});toast('Расход добавлен')});break;
  case 'editExpense':{const e=find('expenses',id);form('Расход',F.expense,e,o=>upsert('expenses',{...e,...o}),()=>remove('expenses',id));break}
  case 'delExpense':remove('expenses',id);toast('Удалено');break;
  case 'addApt':form('Новая квартира',F.apt,{img:'apt1',rooms:1,from:iso(new Date())},o=>{if(o.current)S.apartments.forEach(x=>x.current=false);upsert('apartments',{id:uid(),...o})});break;
  case 'editApt':{const e=find('apartments',id);form('Квартира',F.apt,e,o=>{if(o.current)S.apartments.forEach(x=>{if(x.id!==id)x.current=false});upsert('apartments',{...e,...o})},()=>remove('apartments',id));break}
  case 'delApt':remove('apartments',id);break;
  case 'addUtil':form('Коммуналка за месяц',F.util,{month:mkey(new Date()),internet:250000,garbage:120000},o=>{const ex=S.utilities.find(u=>u.month===o.month);upsert('utilities',{id:ex?ex.id:uid(),...o})});break;
  case 'editUtil':{const e=find('utilities',id);form('Коммуналка',F.util,e,o=>upsert('utilities',{...e,...o}),()=>remove('utilities',id));break}
  case 'delUtil':remove('utilities',id);break;
  case 'addGoal':form('Новая цель',F.goal,{color:'#2f9e5b',icon:'star',saved:0},o=>{if(o.featured)S.goals.forEach(x=>x.featured=false);upsert('goals',{id:uid(),...o})});break;
  case 'editGoal':{const e=find('goals',id);form('Цель',F.goal,e,o=>{if(o.featured)S.goals.forEach(x=>{if(x.id!==id)x.featured=false});upsert('goals',{...e,...o})},()=>remove('goals',id));break}
  case 'delGoal':remove('goals',id);break;

  case 'addEvent':form('Новое событие',F.event,{date:el.dataset.date||iso(new Date()),type:'other'},o=>upsert('events',{id:uid(),done:false,...o}));break;
  case 'editEvent':{const e=find('events',id);form('Событие',F.event,e,o=>upsert('events',{...e,...o}),()=>remove('events',id));break}

  case 'toggleEvent':{const e=find('events',id);e.done=!e.done;save('events');break}

  case 'addCheck':{const inp=document.getElementById('ck-'+id);const v=inp&&inp.value.trim();if(v){find('trips',id).checklist.push({t:v,d:false});save('trips')}break}
  case 'addHealth':form('Новая запись',F.health,{date:iso(new Date()),kind:'Врач'},o=>upsert('health',{id:uid(),...o}));break;
  case 'editHealth':{const e=find('health',id);form('Запись',F.health,e,o=>upsert('health',{...e,...o}),()=>remove('health',id));break}
  case 'delHealth':remove('health',id);break;
  case 'addNote':{const v=$('#newnote').value.trim();if(v){S.notes.unshift({id:uid(),text:v,done:false});save('notes')}break}
  case 'toggleNote':{const n=find('notes',id);n.done=!n.done;save('notes');break}
  case 'editNote':{const n=find('notes',id);form('Заметка',[{k:'text',l:'Текст',req:1,full:1}],n,o=>upsert('notes',{...n,...o}),()=>remove('notes',id));break}
  case 'delNote':remove('notes',id);break;
  case 'useful':{const k=el.dataset.k;const l=USEFUL.find(u=>u[0]===k);form(l[1],[{k:'text',l:'Заметки',t:'area'}],{text:S.useful[k]||''},o=>{S.useful={...S.useful,[k]:o.text};save('useful')});break}
  case 'clearq':U.q='';break;
  case 'exportJson':{const b=$('#jsonbox');b.hidden=false;b.value=JSON.stringify(S,null,1);b.select();try{navigator.clipboard.writeText(b.value).then(()=>toast('JSON скопирован'),()=>toast('Выделите и скопируйте текст'))}catch(e){}break}
  case 'importJson':{const b=$('#jsonbox');if(b.hidden||!b.value.trim()){b.hidden=false;b.value='';b.focus();toast('Вставьте JSON и нажмите «Импорт» ещё раз');break}try{const d=JSON.parse(b.value);SECS.forEach(s=>{if(d[s]!=null){S[s]=d[s];save(s)}});toast('Данные импортированы')}catch(e){toast('Это не похоже на корректный JSON')}break}
  case 'resetDemo':confirmBox('Заменить все данные примером из макета?',()=>loadDemo());break;
  case 'clearAll':confirmBox('Удалить все записи? Настройки останутся.',()=>{['expenses','utilities','apartments','goals','events','trips','notes','health'].forEach(s=>{S[s]=[];save(s)});toast('Данные очищены')});break;
  }
}
function confirmBox(msg,fn){const c=$('#confirm');c.innerHTML=`<div style="margin-top:12px;padding:12px;border-radius:10px;background:#fdf1f0;font-size:12.5px">${esc(msg)}<div style="display:flex;gap:8px;margin-top:8px"><button class="btn danger" id="cy">Да</button><button class="btn ghost" id="cn">Отмена</button></div></div>`;$('#cy').onclick=()=>{c.innerHTML='';fn()};$('#cn').onclick=()=>c.innerHTML=''}

function bind(){
  rootEl.addEventListener('click',e=>{
    if(e.target.closest('#burger')){$('#side').classList.toggle('open');return}
    const el=e.target.closest('[data-act]');
    if(!el){if(!e.target.closest('.search')&&U.q){U.q='';const b=$('#sres');if(b)b.innerHTML=''}return}
    if(el.tagName==='SELECT')return;
    if(el.tagName==='LABEL')return;
    e.preventDefault&&el.tagName!=='A'&&e.preventDefault();
    e.stopPropagation();
    act(el.dataset.act,el);
  });
  rootEl.addEventListener('change',e=>{const el=e.target;const a=el.dataset&&el.dataset.act;if(!a)return;if(a in U){U[a]=el.value;render()}});
  rootEl.addEventListener('input',e=>{if(e.target.id==='q'){U.q=e.target.value;searchRender()}if(/^kw/.test(e.target.id))kwCalc()});
  rootEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newnote'){e.preventDefault();act('addNote',e.target)}if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('ck-')){e.preventDefault();act('addCheck',{dataset:{id:e.target.id.slice(3)}})}});
  rootEl.addEventListener('submit',e=>{if(e.target.id==='setf'){e.preventDefault();const fd=new FormData(e.target);const o={};fd.forEach((v,k)=>o[k]=['temp','feels','rate','budget','kwhPrice'].includes(k)?Number(v):v);S.settings={...S.settings,...o};save('settings');toast('Сохранено')}});
}
document.addEventListener('DOMContentLoaded',()=>{rootEl=document.getElementById('root');bind();init()});
if(document.readyState!=='loading'){rootEl=document.getElementById('root');bind();init()}
})();
</script>
